name: Publish to GreasyFork

on:
  push:
    tags:
      - 'v*.*.*'  # 匹配 v1.0.0, v1.3.2 等格式的 tag
# 设置权限
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install
          cd ./blob-html
          pnpm install
          cd ../

      - name: Prepare release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi

          awk -v heading="## [$version]" '
            { sub(/\r$/, "") }
            found && /^##[[:blank:]]/ { exit }
            !found && index($0, heading) == 1 { found = 1; next }
            !found { next }
            /^[[:blank:]]*$/ { if (printed) blank_lines = blank_lines "\n"; next }
            { printf "%s%s\n", blank_lines, $0; blank_lines = ""; printed = 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/better-miyoushe-release-notes.md"

      - name: Build userscript
        run: pnpm build

      - name: Commit built file to dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          dist_worktree="$RUNNER_TEMP/better-miyoushe-dist"
          release_notes="$RUNNER_TEMP/better-miyoushe-release-notes.md"
          git fetch origin refs/heads/dist
          git worktree add --detach "$dist_worktree" FETCH_HEAD

          # 重跑旧版本时，保留 dist 上已经发布的新版本。
          version=${GITHUB_REF_NAME#v}
          dist_version=$(awk '/^\/\/[[:blank:]]+@version[[:blank:]]+/ { print $3; exit }' "$dist_worktree/better-miyoushe.user.js")
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$dist_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            newest_version=$(printf '%s\n' "$version" "$dist_version" | sort -V | tail -n 1)
            if [[ "$version" != "$newest_version" ]]; then
              echo "dist already contains newer version $dist_version"
              exit 0
            fi
          fi

          cp dist/better-miyoushe.user.js "$dist_worktree/better-miyoushe.user.js"
          git -C "$dist_worktree" add -- better-miyoushe.user.js
          if git -C "$dist_worktree" diff --cached --quiet; then
            echo "dist already contains this build"
            exit 0
          fi

          # Greasy Fork 使用修改脚本文件的提交说明作为版本历史。
          if [[ -s "$release_notes" ]]; then
            git -C "$dist_worktree" commit --cleanup=verbatim -F "$release_notes"
          else
            git -C "$dist_worktree" commit -m "Release $GITHUB_REF_NAME"
          fi
          git -C "$dist_worktree" push origin HEAD:refs/heads/dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/better-miyoushe.user.js
          body_path: ${{ runner.temp }}/better-miyoushe-release-notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
